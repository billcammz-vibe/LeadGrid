<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadGrid — B2B Field Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@googlemaps/markerclusterer@2.5.3/dist/index.min.js"></script>
</head>
<body>

<!-- LOGIN GATE -->
<div class="loginscreen open" id="loginscreen">
  <div class="loginbox">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="11" stroke="#2F6BFF" stroke-width="1.6"/><circle cx="13" cy="4" r="2.4" fill="#4D9FFF"/><circle cx="21" cy="17" r="2.4" fill="#4D9FFF"/><circle cx="5" cy="17" r="2.4" fill="#4D9FFF"/><circle cx="13" cy="13" r="3" fill="#2F6BFF"/><path d="M13 6.4v3.6M18.8 15.6 15.4 13.8M7.2 15.6l3.4-1.8" stroke="#2F6BFF" stroke-width="1.3"/></svg>
      <b>Lead<span>Grid</span></b>
    </div>
    <div class="s">Sign in to continue</div>
    <div class="flbl">Email</div>
    <input id="loginEmail" type="email" autocomplete="username" onkeydown="if(event.key==='Enter')$('#loginPassword').focus()">
    <div class="flbl">Password</div>
    <input id="loginPassword" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="loginerr" id="loginError" style="display:none"></div>
    <button class="btn" id="loginBtn" style="width:100%;justify-content:center" onclick="doLogin()">Sign in</button>
  </div>
</div>

<div id="app" style="display:none">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="11" stroke="#2F6BFF" stroke-width="1.6"/><circle cx="13" cy="4" r="2.4" fill="#4D9FFF"/><circle cx="21" cy="17" r="2.4" fill="#4D9FFF"/><circle cx="5" cy="17" r="2.4" fill="#4D9FFF"/><circle cx="13" cy="13" r="3" fill="#2F6BFF"/><path d="M13 6.4v3.6M18.8 15.6 15.4 13.8M7.2 15.6l3.4-1.8" stroke="#2F6BFF" stroke-width="1.3"/></svg>
      <b>Lead<span>Grid</span></b>
    </div>
    <div class="navlabel">Workspace</div>
    <nav class="nav" id="nav">
      <a data-view="areas" class="active"><i data-ic="map"></i><span>Map</span></a>
      <a data-view="dashboard"><i data-ic="grid"></i><span>Dashboard</span></a>
      <a data-view="crm"><i data-ic="users"></i><span>CRM</span><span class="badge" id="nb-crm">0</span></a>
      <a data-view="finder"><i data-ic="search"></i><span>Finder</span></a>
      <a data-view="calendar"><i data-ic="cal"></i><span>Calendar</span></a>
      <a data-view="routes"><i data-ic="route"></i><span>Routes</span></a>
      <a data-view="reps"><i data-ic="badge"></i><span>Reps</span></a>
    </nav>
    <div class="navlabel">Intelligence</div>
    <nav class="nav">
      <a onclick="openAI()"><i data-ic="spark"></i><span>AI Assistant</span></a>
    </nav>
    <div class="sidefoot">
      <div class="av" id="sfAvatar">·</div>
      <div style="min-width:0;flex:1"><b id="sfName" style="font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></b><small id="sfEmail" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></small></div>
      <button class="rowdel" title="Log out" onclick="logout()" style="width:auto;padding:0 6px;font-size:11px;font-weight:600">Log out</button>
    </div>
  </aside>

  <!-- TOPBAR -->
  <header class="topbar">
    <button class="topbtn navtoggle" id="navtoggle" title="Collapse sidebar" onclick="toggleNav()"><i data-ic="menu"></i></button>
    <h1 id="crumb">Dashboard</h1>
    <div class="search"><i data-ic="search"></i><input id="globalsearch" placeholder="Search businesses, contacts, areas…"></div>
    <div class="repswitch"><i data-ic="badge"></i><select id="repfilter"><option value="all">All reps</option></select></div>
    <button class="topbtn" onclick="openAI()"><i data-ic="spark"></i></button>
  </header>

  <!-- MAIN -->
  <main class="main" id="main">
    <section class="view" data-view="dashboard" id="v-dashboard"></section>
    <section class="view" data-view="crm" id="v-crm"></section>
    <section class="view nopad active" data-view="areas" id="v-areas"></section>
    <section class="view" data-view="finder" id="v-finder"></section>
    <section class="view" data-view="calendar" id="v-calendar"></section>
    <section class="view" data-view="routes" id="v-routes"></section>
    <section class="view" data-view="reps" id="v-reps"></section>
  </main>
</div>

<!-- DRAWER -->
<div class="drawer-wrap" id="drawer"><div class="scrim" onclick="closeDrawer()"></div><div class="drawer" id="drawerbody"></div></div>

<!-- CONFIRM -->
<div class="confirm-wrap" id="confirmModal"><div class="scrim" onclick="closeConfirm()"></div>
  <div class="confirm-box">
    <div class="confirm-icon"><i data-ic="trash" data-c="#EF4444" data-s="22"></i></div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-acts"><button class="btn ghost" onclick="closeConfirm()">Cancel</button><button class="btn danger" onclick="doConfirm()" id="confirmYes">Delete</button></div>
  </div>
</div>

<!-- REP EDITOR -->
<div class="confirm-wrap" id="repModal"><div class="scrim" onclick="closeRepModal()"></div>
  <div class="confirm-box" style="text-align:left;max-width:360px">
    <div style="font-weight:600;font-size:16px;margin-bottom:16px" id="repModalTitle">Add rep</div>
    <div class="flbl">Name</div>
    <input id="repName" style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);margin-bottom:12px">
    <div class="flbl">Initials</div>
    <input id="repInit" maxlength="3" style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);margin-bottom:12px">
    <div class="flbl">Territory</div>
    <input id="repArea" placeholder="e.g. Mississauga · Oakville" style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);margin-bottom:12px">
    <div class="flbl">Color</div>
    <input id="repColor" type="color" value="#2F6BFF" style="width:100%;height:38px;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:2px;margin-bottom:14px">
    <div id="repModalError" style="color:#F87171;font-size:12px;margin-bottom:10px;display:none"></div>
    <div class="confirm-acts">
      <button class="btn ghost" style="flex:1;justify-content:center" onclick="closeRepModal()">Cancel</button>
      <button class="btn" style="flex:1;justify-content:center" onclick="saveRepModal()">Save</button>
    </div>
    <button class="btn ghost" id="repDeleteBtn" style="width:100%;justify-content:center;margin-top:10px;color:#F87171;display:none" onclick="deleteRepFromModal()">Delete rep</button>
  </div>
</div>

<!-- MEETING EDITOR -->
<div class="confirm-wrap" id="meetingModal"><div class="scrim" onclick="closeMeetingModal()"></div>
  <div class="confirm-box" style="text-align:left;max-width:360px">
    <div style="font-weight:600;font-size:16px;margin-bottom:16px">New meeting</div>
    <div class="flbl">Lead</div>
    <select id="meetLead" onchange="onMeetLeadChange()" style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);margin-bottom:12px"></select>
    <div class="flbl">Rep</div>
    <select id="meetRep" style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);margin-bottom:12px"></select>
    <div class="flbl">Type</div>
    <select id="meetType" style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);margin-bottom:12px">
      <option>Call</option><option>Meeting</option><option>Demo</option><option>Follow-up</option>
    </select>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><div class="flbl">Date</div><input id="meetDate" type="date" style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);margin-bottom:12px"></div>
      <div style="flex:1"><div class="flbl">Time</div><select id="meetHour" style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);margin-bottom:12px"></select></div>
    </div>
    <div id="meetModalError" style="color:#F87171;font-size:12px;margin-bottom:10px;display:none"></div>
    <div class="confirm-acts">
      <button class="btn ghost" style="flex:1;justify-content:center" onclick="closeMeetingModal()">Cancel</button>
      <button class="btn" style="flex:1;justify-content:center" onclick="saveMeetingModal()">Save</button>
    </div>
  </div>
</div>

<!-- AI -->
<button class="ai-fab" id="aifab" onclick="openAI()"><i data-ic="spark" data-c="#fff" data-s="22"></i></button>
<div class="ai-panel" id="aipanel">
  <div class="ai-head">
    <div class="aicon"><i data-ic="spark" data-c="#fff" data-s="18"></i></div>
    <div><b>Grid Assistant</b><small>Reading your pipeline</small></div>
    <button class="x" onclick="closeAI()"><i data-ic="x"></i></button>
  </div>
  <div class="ai-body" id="aibody"></div>
  <div class="ai-sugg" id="aisugg"></div>
  <div class="ai-input"><input id="aiinput" placeholder="Ask about your pipeline…" onkeydown="if(event.key==='Enter')aiSend()"><button onclick="aiSend()"><i data-ic="send" data-c="#fff" data-s="18"></i></button></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
